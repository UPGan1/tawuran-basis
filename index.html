async function handleAuth() {
let username = document.getElementById('usernameInput').value.trim().toLowerCase();

const existing = rows.length > 0 ? rows[0] : null;
if (existing) {

return;
}
currentUser = existing;

}

pin: pin,

};

});

['viewBeranda', 'viewMading', 'viewLatihan', 'viewProfil', 'viewMarkas'].forEach(function(id) {
document.getElementById(id).classList.add('hidden');
});
document.getElementById(viewId).classList.remove('hidden');
document.querySelectorAll('.nav-btn').forEach(function(b, i) {

else b.classList.remove('active');
});

if (viewId === 'viewProfil') { loadChallenges(); }

async function addStat(type) {
if ((currentUser.points || 0) <= 0) return alert('Poin stat habis! Mainkan Latihan untuk naik level.');
if ((currentUser[type] || 50) >= 99) return alert('Stat sudah mentok 99!');
currentUser[type] = (currentUser[type] || 50) + 1;
currentUser.points -= 1;
await savePlayer();
}
function drawFighter(ctx, x, y, dir, action, colorShirt, colorShoe, isKo) {
ctx.save();
ctx.translate(x, y);
if (isKo) {
ctx.rotate(dir === 1 ? -Math.PI / 2.2 : Math.PI / 2.2);
ctx.translate(0, 25);
}
ctx.scale(dir, 1);
ctx.fillStyle = 'rgba(0,0,0,0.45)';
ctx.beginPath();
ctx.ellipse(0, 58, 24, 6, 0, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = '#334155';
ctx.lineWidth = 8;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(-6, 18);
ctx.lineTo(-14, 38);
ctx.lineTo(-16, 54);
ctx.stroke();
ctx.fillStyle = colorShoe;
ctx.fillRect(-20, 51, 12, 6);
ctx.beginPath();
ctx.moveTo(6, 18);
if (action === 'KICK') {
ctx.lineTo(26, 10);
ctx.lineTo(48, 4);
ctx.stroke();
ctx.fillStyle = colorShoe;
ctx.fillRect(44, -2, 12, 8);
} else {
ctx.lineTo(14, 38);
ctx.lineTo(16, 54);
ctx.stroke();
ctx.fillStyle = colorShoe;
ctx.fillRect(12, 51, 12, 6);
}
ctx.fillStyle = colorShirt;
ctx.fillRect(-12, -20, 24, 38);
ctx.fillStyle = '#0f172a';
ctx.fillRect(-13, -20, 7, 38);
ctx.fillRect(6, -20, 7, 38);
ctx.fillStyle = '#fed7aa';
ctx.beginPath();
ctx.arc(0, -34, 12, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = '#090d16';
ctx.beginPath();
ctx.arc(0, -37, 12, Math.PI, 0);
ctx.fill();
ctx.strokeStyle = '#fed7aa';
ctx.lineWidth = 6;
if (action === 'PUNCH') {
ctx.beginPath();
ctx.moveTo(8, -12);
ctx.lineTo(44, -14);
ctx.stroke();
ctx.fillStyle = '#ef4444';
ctx.beginPath();
ctx.arc(46, -14, 6, 0, Math.PI * 2);
ctx.fill();
} else if (action === 'BLOCK') {
ctx.beginPath();
ctx.moveTo(8, -12);
ctx.lineTo(18, -26);
ctx.moveTo(-6, -12);
ctx.lineTo(16, -22);
ctx.stroke();
ctx.strokeStyle = '#38bdf8';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(22, -16, 26, -Math.PI / 2.5, Math.PI / 2.5);
ctx.stroke();
} else {
ctx.beginPath();
ctx.moveTo(8, -12);
ctx.lineTo(20, -4);
ctx.lineTo(24, -18);
ctx.stroke();
ctx
.fillStyle = '#fed7aa';
ctx.beginPath();
ctx.arc(24, -20, 5, 0, Math.PI * 2);
ctx.fill();
}
ctx.restore();
}
function startMiniGame(statType, title) {
if (mgInterval) clearInterval(mgInterval);
if (mgTimerInt) clearInterval(mgTimerInt);
mgScore = 0;
mgCombo = 0;
mgCursorPos = 0;
mgDir = 1;
mgHeroAction = 'IDLE';
let timeLeft = 15;
document.getElementById('miniGameArena').classList.remove('hidden');
document.getElementById('mgTitle').innerText = title.toUpperCase();
document.getElementById('mgScore').innerText = '0';
document.getElementById('mgCombo').innerText = '0x';
document.getElementById('mgTimer').innerText = timeLeft;
const tCanvas = document.getElementById('trainCanvas');
const tCtx = tCanvas.getContext('2d');
mgInterval = setInterval(function() {
mgCursorPos += mgDir * 3.4;
if (mgCursorPos >= 96) { mgCursorPos = 96; mgDir = -1; }
if (mgCursorPos <= 0) { mgCursorPos = 0; mgDir = 1; }
document.getElementById('mgCursor').style.left = mgCursorPos + '%';
tCtx.clearRect(0, 0, 380, 150);
tCtx.fillStyle = '#1e293b';
tCtx.fillRect(0, 130, 380, 20);
const swing = mgHeroAction !== 'IDLE' ? 14 : 0;
tCtx.strokeStyle = '#94a3b8';
tCtx.lineWidth = 3;
tCtx.beginPath();
tCtx.moveTo(250, 0);
tCtx.lineTo(250 + swing, 45);
tCtx.stroke();
tCtx.fillStyle = '#0f172a';
tCtx.fillRect(232 + swing, 45, 36, 52);
tCtx.strokeStyle = '#f59e0b';
tCtx.strokeRect(232 + swing, 45, 36, 52);
drawFighter(tCtx, 155, 76, 1, mgHeroAction, '#f8fafc', '#dc2626', false);
if (mgHeroAction !== 'IDLE') {
tCtx.fillStyle = '#fbbf24';
tCtx.font = 'bold 14px sans-serif';
tCtx.fillText('💥 DUAR!', 215, 40);
}
}, 25);
mgTimerInt = setInterval(async function() {
timeLeft -= 1;
document.getElementById('mgTimer').innerText = timeLeft;
if (timeLeft <= 0) {
clearInterval(mgInterval);
clearInterval(mgTimerInt);
mgInterval = null;
document.getElementById('miniGameArena').classList.add('hidden');
const gainedXp = Math.min(20, Math.max(5, Math.floor(mgScore / 50)));
currentUser.xp = (currentUser.xp || 0) + gainedXp;
currentUser.daily_xp = (currentUser.daily_xp || 0) + gainedXp;
currentUser.silver = (currentUser.silver || 500) + 25;
const reqXp = (currentUser.level || 1) * 100;
if (currentUser.xp >= reqXp) {
currentUser.xp -= reqXp;
currentUser.level = (currentUser.level || 1) + 1;
currentUser.points = (currentUser.points || 0) + 2;
alert('NAIK LEVEL! Sekarang kamu Level ' + currentUser.level + ' (+2 Poin Stat & +' + gainedXp + ' XP)!');
} else {
alert('Latihan Selesai! Skor: ' + mgScore + ' | Dapat +' + gainedXp + ' XP & +25 Silver!');
}
await savePlayer();
}
}, 1000);
}
function hitTiming() {
if (!mgInterval) return;
if (mgCursorPos >= 36 && mgCursorPos <= 64) {
mgCombo += 1;
mgScore += 100 + (mgCombo * 15);
mgHeroAction = (mgCombo % 2 === 0) ? 'KICK' : 'PUNCH';
} else {
mgCombo = 0;
mgScore = Math.max(0, mgScore - 20);
mgHeroAction = 'BLOCK';
}
setTimeout(function() { mgHeroAction = 'IDLE'; }, 220);
document.getElementById('mgScore').innerText = mgScore;
document.getElementById('mgCombo').innerText = mgCombo + 'x';
}
function playCinematicFight(enemyName, isWin, onComplete) {
const modal = document.getElementById('fightModal');
const feed = document.getElementById('fightFeed');
const closeBtn = document.getElementById('closeFightBtn');
const vid = document.getElementById('customFightVideo');
const canvas = document.getElementById('fightCanvas');
const ctx = canvas.getContext('2d');
modal.classList.remove('hidden');
closeBtn.classList.add('hidden');
document.getElementById('fNameLeft').innerText = currentUser.username;
document.getElementById('fNameRight').innerText = enemyName;
document.getElementById('hpLeft').style.width = '100%';
document.getElementById('hpRight').style.width = '100%';
feed.innerHTML = '';
const chosenVid = isWin ? VIDEO_URL_WIN : VIDEO_URL_LOSE;
if (chosenVid) {
vid.src = chosenVid;
vid.classList.remove('hidden');
} else {
vid.classList.add('hidden');
}
let hpL = 100;
let hpR = 100;
let posL = 135;
let posR = 265;
let actL = 'IDLE';
let actR = 'IDLE';
let koL = false;
let koR = false;
let sparkText = '';
let step = 0;
const rounds = [
{ who: 'L', move: 'PUNCH', block: true, dmg: 12, log: currentUser.username + ' melancarkan pukulan jab cepat, ditangkis ' + enemyName + '!' },
{ who: 'R', move: 'KICK', block: false, dmg: 22, log: enemyName + ' membalas dengan tendangan rendah telak! (-22 HP)' },
{ who: 'L', move: 'KICK', block: false, dmg: 30, log: currentUser.username + ' membalas tendangan berputar mengenai bahu lawan! (-30 HP)' },
{ who: 'R', move: 'PUNCH', block: true, dmg: 10, log: currentUser.username + ' memasang tangkisan silang menahan pukulan keras lawan!' },
{ who: isWin ? 'L' : 'R', move: 'KICK', block: false, dmg: 100, log: isWin ? '💥 TENDANGAN PAMUNGKAS! ' + enemyName + ' terpental K.O!' : '💥 HANTAMAN BALASAN! ' + currentUser.username + ' terjatuh K.O!' }
];
const animLoop = setInterval(function() {
ctx.clearRect(0, 0, 400, 210);
ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 175, 400, 35);
ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
ctx.beginPath();
ctx.moveTo(0, 175);
ctx.lineTo(400, 175);
ctx.stroke();
drawFighter(ctx, posL, 120, 1, actL, '#f8fafc', '#22c55e', koL);
drawFighter(ctx, posR, 120, -1, actR, '#cbd5e1', '#ef4444', koR);
if (sparkText) {
ctx.fillStyle = '#fbbf24';
ctx.font = 'bold 15px sans-serif';
ctx.textAlign = 'center';
ctx.fillText(sparkText, 200, 55);
}
}, 30);
const stepLoop = setInterval(function() {
if (step >= rounds.length) {
clearInterval(stepLoop);
setTimeout(function() {
clearInterval(animLoop);
closeBtn.classList.remove('hidden');
onComplete();
}, 700);
return;
}
const r = rounds[step];
if (r.who === 'L') {
posL = 185;
actL = r.move;
actR = r.block ? 'BLOCK' : 'IDLE';
sparkText = r.block ? '🛡️ TANGKIS!' : '💥 DUAR!';
hpR = Math.max(0, hpR - r.dmg);
if (hpR === 0) koR = true;
} else {
posR = 215;
actR = r.move;
actL = r.block ? 'BLOCK' : 'IDLE';
sparkText = r.block ? '🛡️ TANGKIS!' : '💥 KENAK!';
hpL = Math.max(0, hpL - r.dmg);
if (hpL === 0) koL = true;
}
document.getElementById('hpLeft').style.width = hpL + '%';
document.getElementById('hpRight').style.width = hpR + '%';
feed.innerHTML += '• ' + r.log + '';
feed.scrollTop = feed.scrollHeight;
setTimeout(function() {
posL = 135;
posR = 265;
actL = 'IDLE';
actR = 'IDLE';
sparkText = '';
}, 550);
step += 1;
}, 950);
}

async function loadLeaderboard() {
const res = await fetch(SUPABASE_URL + '/rest/v1/players?select=username,school,stars,wins,losses&order=stars.desc&limit=50', { headers: headers });
const list = await res.json();
if (!list || list.length === 0) return;
const p1 = list[0] || { username: '-', stars: 0 };
const p2 = list[1] || { username: '-', stars: 0 };
const p3 = list[2] || { username: '-', stars: 0 };
document.getElementById('top3Container').innerHTML =
'#2' + p2.username + '★ ' + (p2.stars || 10) + '' +
'👑 #1' + p1.username + '★ ' + (p1.stars || 10) + '' +
'#3' + p3.username + '★ ' + (p3.stars || 10) + '';
const schools = ['SEKOLAH VIP AO', 'STM BOEDOET 145', 'STM KAMPUNG JAWA', 'STM PENERBANGAN', 'SMK KAPAL 69'];
const html = schools.map(function(s, idx) {
const members = list.filter(function(m) { return m.school === s; });
const totalStars = members.reduce(function(acc, cur) { return acc + (cur.stars || 10); }, 0);
return '' +
'#' + (idx + 1) + ' ' + s + ' (' + members.length + ' anggota)' +
'★ ' + totalStars + '';
}).join('');
document.getElementById('schoolStandingsList').innerHTML = html;
}

async function sendChallenge(directTarget) {
let target = directTarget || document.getElementById('targetUserInput').value.trim().toLowerCase();
if (!target) return alert('Masukkan @username lawan dulu!');
if (!target.startsWith('@')) target = '@' + target;
if (target === currentUser.username) return alert('Tidak bisa menantang diri sendiri!');
const check = await fetch(SUPABASE_URL + '/rest/v1/players?username=eq.' + encodeURIComponent(target) + '&select=*', { headers: headers });
const rows = await check.json();
if (!rows || rows.length === 0) return alert('Pemain ' + target + ' tidak ditemukan!');
const enemy = rows[0];
const myOvr = calcOvr(currentUser);
const enOvr = calcOvr(enemy);
const isWin = (myOvr + Math.floor(Math.random() * 12)) >= (enOvr + Math.floor(Math.random() * 12));
const winner = isWin ? currentUser.username : enemy.username;
playCinematicFight(enemy.username, isWin, async function() {
if (isWin) {
currentUser.challenge_wins = (currentUser.challenge_wins || 0) + 1;
currentUser.stars = (currentUser.stars || 10) + 1;
currentUser.silver = (currentUser.silver || 500) + 50;
} else {
currentUser.challenge_losses = (currentUser.challenge_losses || 0) + 1;
}
await fetch(SUPABASE_URL + '/rest/v1/challenges', {
method: 'POST',
headers: headers,
body: JSON.stringify({ challenger: currentUser.username, defender: enemy.username, status: 'DONE', winner: winner })
});
document.getElementById('targetUserInput').value = '';
await savePlayer();
loadChallenges();
});
}
async function loadChallenges() {
const res = await fetch(SUPABASE_URL + '/rest/v1/challenges?or=(challenger.eq.' + encodeURIComponent(currentUser.username) + ',defender.eq.' + encodeURIComponent(currentUser.username) + ')&order=created_at.desc&limit=10', { headers: headers });

const box = document.getElementById('challengeInbox');
if (!list || list.length === 0) {
box.innerHTML = 'Belum ada riwayat tantangan.';
return;
}
box.innerHTML = list.map(function(c) {

return '' +
'' + c.challenger + ' vs ' + c.defender + '' +
'' + (won ? 'Menang' : 'Kalah') + '';
}).join('');
}

async function redeemCode() {
const code = document.getElementById('vipCodeInput').value.trim().toUpperCase();
if (!code) return alert('Masukkan kode voucher dulu!');
const res = await fetch(SUPABASE_URL + '/rest/v1/vip_codes?code=eq.' + encodeURIComponent(code) + '&is_used=eq.false&select=*', { headers: headers });
const rows = await res.json();
if (!rows || rows.length === 0) return alert('Kode tidak valid atau sudah dipakai!');
const data = rows[0];
const newRank = Math.min(10, data.rank_level || 1);
currentUser.donor_rank = Math.max(currentUser.donor_rank || 0, newRank);
currentUser.gold = (currentUser.gold || 0) + (newRank * 100);
if (currentUser.donor_rank >= 10) {
currentUser.school = 'SEKOLAH VIP AO';
currentUser.role = 'GURU';
alert('SELAMAT! Kamu mencapai Rank 10 dan diangkat menjadi GURU VIP di SEKOLAH VIP AO!');
} else {
alert('Berhasil klaim Voucher Rank ' + newRank + '! +' + (newRank * 100) + ' Gold!');
}
await fetch(SUPABASE_URL + '/rest/v1/vip_codes?code=eq.' + encodeURIComponent(code), {
method: 'PATCH',
headers: headers,
body: JSON.stringify({ is_used: true, used_by: currentUser.username })
});
await savePlayer();
}
function startCountdown() {
setInterval(function() {
const now = new Date();
const target = new Date();
if (now.getHours() < 12) target.setHours(12, 0, 0, 0);
else if (now.getHours() < 21 || (now.getHours() === 21 && now.getMinutes() < 30)) target.setHours(21, 30, 0, 0);
else { target.setDate(target.getDate() + 1); target.setHours(12, 0, 0, 0); }
const diff = Math.max(0, Math.floor((target - now) / 1000));
const h = String(Math.floor(diff / 3600)).padStart(2, '0');
const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
const s = String(diff % 60).padStart(2, '0');
document.getElementById('warCountdown').innerText = h + ':' + m + ':' + s;
}, 1000);
}
