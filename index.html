function drawFighter(ctx, x, y, dir, act, shirt, shoe, ko) {
  ctx.save();
  ctx.translate(x, y);
  if (ko) { ctx.rotate(dir === 1 ? -1.4 : 1.4); ctx.translate(0, 24); }
  ctx.scale(dir, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, 56, 22, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(-14, 38); ctx.lineTo(-16, 52); ctx.stroke();
  ctx.fillStyle = shoe; ctx.fillRect(-20, 49, 12, 6);
  ctx.beginPath(); ctx.moveTo(6, 18);
  if (act === 'KICK') { ctx.lineTo(26, 10); ctx.lineTo(46, 4); ctx.stroke(); ctx.fillRect(42, -2, 12, 8); }
  else { ctx.lineTo(14, 38); ctx.lineTo(16, 52); ctx.stroke(); ctx.fillRect(12, 49, 12, 6); }
  ctx.fillStyle = shirt; ctx.fillRect(-12, -20, 24, 38);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-13, -20, 6, 38); ctx.fillRect(7, -20, 6, 38);
  ctx.fillStyle = '#fed7aa'; ctx.beginPath(); ctx.arc(0, -33, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#090d16'; ctx.beginPath(); ctx.arc(0, -36, 11, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#fed7aa'; ctx.lineWidth = 6;
  if (act === 'PUNCH') {
    ctx.beginPath(); ctx.moveTo(8, -12); ctx.lineTo(44, -14); ctx.stroke();
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(46, -14, 6, 0, Math.PI*2); ctx.fill();
  } else if (act === 'BLOCK') {
    ctx.beginPath(); ctx.moveTo(8, -12); ctx.lineTo(18, -26); ctx.stroke();
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(22, -16, 24, -1.2, 1.2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(8, -12); ctx.lineTo(20, -4); ctx.lineTo(24, -16); ctx.stroke();
  }
  ctx.restore();
}

const loop = setInterval(() => {
if (step >= steps.length) {

sCard.appendChild(el('div', 'font-weight:900;font-size:12px;color:#fbbf24;margin-bottom:8px', '📊 5 STAT PETARUNG (Sisa Poin: ' + (U.points||0) + ')'));
[['power','🥊 Pukulan'],['speed','⚡ Kecepatan'],['stamina','🦵 Tendangan'],['defense','🛡️ Tangkisan'],['endurance','💪 Daya Tahan']].forEach(st => {
const row = el('div', 'display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e293b;font-size:12px');
row.appendChild(el('span', '', st[1] + ': ' + (U[st[0]]||50)));
const bp = el('button', 'padding:4px 10px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer', '+1');
bp.onclick = async () => {
if ((U.points||0) <= 0) return alert('Poin stat habis!');
if ((U[st[0]]||50) >= 99) return alert('Sudah mentok 99!');
U[st[0]] = (U[st[0]]||50) + 1; U.points -= 1;
await saveU(); renderApp();
};
row.appendChild(bp); sCard.appendChild(row);
});
body.appendChild(sCard);
const dCard = el('div', 'background:#111623;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:12px');
dCard.appendChild(el('div', 'font-weight:900;font-size:12px;color:#fbbf24;margin-bottom:8px', '⚡ TANTANG DUEL 1V1 (LIVE ANIMASI)'));
const inpT = el('input', 'width:100%;box-sizing:border-box;padding:11px;margin-bottom:8px;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff');
inpT.placeholder = 'Ketik @username lawan...';
const bT = el('button', 'width:100%;padding:12px;border:none;border-radius:9px;background:#ef4444;color:#fff;font-weight:900;cursor:pointer', '⚔️ TANTANG SEKARANG');
bT.onclick = async () => {
let t = inpT.value.trim().toLowerCase();
if (!t) return alert('Isi username lawan!');
if (!t.startsWith('@')) t = '@' + t;
if (t === U.username) return alert('Tidak bisa menantang diri sendiri!');
const r = await fetch(URL_SB + '/rest/v1/players?username=eq.' + encodeURIComponent(t) + '&select=*', {headers:H});
const rows = await r.json();
if (!rows || !rows.length) return alert('Pemain ' + t + ' tidak ditemukan!');
const en = rows[0];
const win = (ovrOf(U) + Math.random()*12) >= (ovrOf(en) + Math.random()*12);
showFightModal(en.username, win, async () => {
if (win) { U.stars = (U.stars||10)+1; U.challenge_wins = (U.challenge_wins||0)+1; U.silver = (U.silver||500)+50; }
else { U.challenge_losses = (U.challenge_losses||0)+1; }
await saveU(); renderApp();
});
};
dCard.append(inpT, bT); body.appendChild(dCard);
const vCard = el('div', 'background:#111623;border:1px solid #1e293b;border-radius:14px;padding:14px');
const inpV = el('input', 'width:100%;box-sizing:border-box;padding:11px;margin-bottom:8px;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff');
inpV.placeholder = 'Kode Voucher Donatur (Rank 1-10)...';
const bV = el('button', 'width:100%;padding:11px;margin-bottom:10px;border:none;border-radius:9px;background:#f59e0b;color:#000;font-weight:900;cursor:pointer', '🎁 KLAIM VOUCHER');
bV.onclick = async () => {
const c = inpV.value.trim().toUpperCase();
if (!c) return alert('Isi kode voucher!');
const r = await fetch(URL_SB + '/rest/v1/vip_codes?code=eq.' + encodeURIComponent(c) + '&is_used=eq.false&select=', {headers:H});
const rows = await r.json();
if (!rows || !rows.length) return alert('Kode tidak valid atau sudah dipakai!');
const rk = rows[0].rank_level || 1;
U.donor_rank = Math.max(U.donor_rank||0, rk); = (U.gold||0) + rk100;
if (U.donor_rank >= 10) { = 'SEKOLAH VIP AO'; U.role = 'GURU'; alert('SELAMAT! Kamu menjadi GURU VIP di SEKOLAH VIP AO!'); }
else { alert('Berhasil klaim Rank ' + rk + '!'); }
await fetch(URL_SB + '/rest/v1/vip_codes?code=eq.' + encodeURIComponent(c), {method:'PATCH',headers:H,body:JSON.stringify({is_used:true,used_by:U.username})});
await saveU(); renderApp();
};
const bOut = el('button', 'width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#f87171;cursor:pointer', 'Keluar Akun');
bOut.onclick = () => { localStorage.removeItem('tb_v2'); renderLogin(); };
vCard.append(inpV, bV, bOut); body.appendChild(vCard);
}
if (TAB === 'MARKAS') {
body.appendChild(el('div', 'font-weight:900;font-size:13px;color:#fbbf24;margin-bottom:8px', '💬 TONGKRONGAN ALUN-ALUN GLOBAL'));
const cList = el('div', 'height:230px;overflow-y:auto;background:#090d16;border:1px solid #1e293b;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px', 'Memuat obrolan...');
body.appendChild(cList);
const inpM = el('input', 'width:100%;box-sizing:border-box;padding:11px;margin-bottom:8px;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff');
inpM.placeholder = 'Tulis pesan psywar atau obrolan...';
const bM = el('button', 'width:100%;padding:12px;border:none;border-radius:9px;background:#ef4444;color:#fff;font-weight:900;cursor:pointer', 'KIRIM PESAN');
bM.onclick = async () => {
if (!inpM.value.trim()) return;
await fetch(URL_SB + '/rest/v1/messages', {method:'POST',headers:H,body:JSON.stringify({sender:U.username,school:,content:inpM.value.trim()})});
inpM.value = ''; renderApp();
};
body.append(inpM, bM);
fetch(URL_SB + '/rest/v1/messages?select=*&order=created_at.desc&limit=25', {headers:H}).then(r => r.json()).then(msgs => {
cList.innerHTML = '';
(msgs || []).reverse().forEach(m => {
cList.appendChild(el('div', 'padding:6px 0;border-bottom:1px solid #151c2c', m.sender + ' [' + m.school + ']: ' + m.content));
});
cList.scrollTop = cList.scrollHeight;
});
}
const nav = el('div', 'position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;background:#0b0f19;border-top:1px solid rgba(245,158,11,0.4);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 0;z-index:30');
[['BERANDA','🏠'],['MADING','📋'],['LATIHAN','🥊'],['PROFIL','👤'],['MARKAS','💬']].forEach(item => {
const nb = el('button', 'background:none;border:none;color:'+(TAB===item[0]?'#fbbf24':'#64748b')+';font-size:10px;font-weight:900;cursor:pointer', item[1] + ' ' + item[0]);
nb.onclick = () => { TAB = item[0]; renderApp(); };
nav.appendChild(nb);
});
shell.appendChild(nav);
document.body.appendChild(shell);
}
const saved = localStorage.getItem('tb_v2');
if (saved) { U = JSON.parse(saved); renderApp(); } else { renderLogin(); }  }, 30);
</script>
</body>
</html>
