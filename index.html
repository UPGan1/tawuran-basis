<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TAWURAN BASIS • Season 0</title>
</head>
<body style="margin:0;background:#07090e;color:#fff;font-family:system-ui,sans-serif">
<script>
const URL_SB = 'https://supabase.co';
const KEY_SB = 'TEMPEL_KUNCI_ANON_EYJ_KAMU_DISINI';
const H = {'apikey':KEY_SB,'Authorization':'Bearer '+KEY_SB,'Content-Type':'application/json','Prefer':'return=representation'};
let U = null, SCH = '';

function el(tag, css, text) {
  const e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderLogin() {
  document.body.innerHTML = '';
  const box = el('div', 'max-width:440px;margin:20px auto;padding:18px;background:#111827;border:1px solid #f59e0b;border-radius:16px');
  box.appendChild(el('h2', 'color:#fbbf24;margin:0 0 12px', '👊 TAWURAN BASIS • SEASON 0'));

  const inpU = el('input', 'width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff');
  inpU.placeholder = 'Username IG (contoh: @rdo.iny_)';
  const inpP = el('input', 'width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff');
  inpP.type = 'password'; inpP.maxLength = 4; inpP.placeholder = '4 Digit PIN';
  box.append(inpU, inpP);

  ['STM BOEDOET 145','STM KAMPUNG JAWA','STM PENERBANGAN','SMK KAPAL 69','SEKOLAH VIP AO'].forEach(s => {
    const b = el('button', 'width:100%;padding:10px;margin-bottom:6px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:bold;cursor:pointer', s);
    b.onclick = () => {
      SCH = s;
      box.querySelectorAll('button.sch').forEach(x => { x.style.background = '#1e293b'; x.style.color = '#fff'; });
      b.style.background = '#f59e0b'; b.style.color = '#000';
    };
    b.className = 'sch';
    box.appendChild(b);
  });

  const btnGo = el('button', 'width:100%;padding:14px;margin-top:8px;border:none;border-radius:10px;background:#f59e0b;color:#000;font-weight:900;cursor:pointer', '🚀 MASUK KE BASIS');
  btnGo.onclick = async () => {
    let u = inpU.value.trim().toLowerCase();
    const p = inpP.value.trim();
    if (!u) return alert('Isi username!');
    if (!u.startsWith('@')) u = '@' + u;
    if (p.length !== 4) return alert('PIN wajib 4 angka!');
    btnGo.textContent = '⏳ MEMPROSES...';
    const r = await fetch(URL_SB + '/rest/v1/players?username=eq.' + encodeURIComponent(u) + '&select=*', {headers:H});
    const rows = await r.json();
    if (rows && rows.length > 0) {
      if (rows[0].pin !== p) { btnGo.textContent = '🚀 MASUK KE BASIS'; return alert('PIN salah!'); }
      U = rows[0];
    } else {
      if (!SCH) { btnGo.textContent = '🚀 MASUK KE BASIS'; return alert('Pilih sekolah dulu!'); }
      const vip = (u === '@rdo.iny_' || u === '@rdo.iny');
      const np = {username:u,pin:p,school:vip?'SEKOLAH VIP AO':SCH,power:vip?99:50,speed:vip?99:50,defense:vip?99:50,stamina:vip?99:50,endurance:vip?99:50,points:vip?50:5,level:vip?19:1,xp:0,stars:vip?50:10,silver:vip?5000:500,gold:vip?999:0,donor_rank:vip?10:0,role:vip?'KEPALA SEKOLAH':'SISWA',title:vip?'Penguasa Basis AO':'Pionir Season 0'};
      const ins = await fetch(URL_SB + '/rest/v1/players', {method:'POST',headers:H,body:JSON.stringify(np)});
      const d = await ins.json();
      U = d[0];
    }
    localStorage.setItem('tb_v2', JSON.stringify(U));
    renderHome();
  };
  box.appendChild(btnGo);
  document.body.appendChild(box);
}

async function renderHome() {
  document.body.innerHTML = '';
  const ovr = Math.round(((U.power||50)+(U.speed||50)+(U.defense||50)+(U.stamina||50)+(U.endurance||50))/5);
  const wrap = el('div', 'max-width:460px;margin:0 auto;padding:14px');

  const card = el('div', 'padding:16px;background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #f59e0b;border-radius:16px;margin-bottom:12px');
  card.appendChild(el('div', 'color:#fbbf24;font-size:11px;font-weight:bold', '🛡️ ' + U.school + ' • ' + U.role));
  card.appendChild(el('h2', 'margin:6px 0', U.username + ' (OVR ' + ovr + ')'));
  card.appendChild(el('div', 'font-size:13px;color:#cbd5e1', 'Level ' + U.level + ' • ★ ' + U.stars + ' Bintang • 🪙 ' + U.silver + ' Silver • 👑 ' + U.gold + ' Gold'));
  wrap.appendChild(card);

  const btnTrain = el('button', 'width:100%;padding:14px;margin-bottom:10px;border:none;border-radius:10px;background:#ef4444;color:#fff;font-weight:900;cursor:pointer', '🥊 LATIHAN PUKUL BAN (+15 XP & +25 SILVER)');
  btnTrain.onclick = async () => {
    U.xp = (U.xp||0) + 15; U.silver = (U.silver||500) + 25;
    if (U.xp >= U.level*100) { U.xp -= U.level*100; U.level++; U.points = (U.points||0)+2; }
    await fetch(URL_SB + '/rest/v1/players?username=eq.' + encodeURIComponent(U.username), {method:'PATCH',headers:H,body:JSON.stringify({xp:U.xp,level:U.level,points:U.points,silver:U.silver})});
    localStorage.setItem('tb_v2', JSON.stringify(U));
    alert('Latihan berhasil! +15 XP & +25 Silver');
    renderHome();
  };
  wrap.appendChild(btnTrain);

  const inpEnemy = el('input', 'width:100%;box-sizing:border-box;padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff');
  inpEnemy.placeholder = 'Ketik @username lawan untuk duel 1v1...';
  const btnDuel = el('button', 'width:100%;padding:14px;margin-bottom:12px;border:none;border-radius:10px;background:#f59e0b;color:#000;font-weight:900;cursor:pointer', '⚡ TANTANG DUEL 1V1');
  btnDuel.onclick = async () => {
    let t = inpEnemy.value.trim().toLowerCase();
    if (!t) return alert('Isi username lawan!');
    if (!t.startsWith('@')) t = '@' + t;
    const r = await fetch(URL_SB + '/rest/v1/players?username=eq.' + encodeURIComponent(t) + '&select=*', {headers:H});
    const rows = await r.json();
    if (!rows || !rows.length) return alert('Lawan tidak ditemukan!');
    const en = rows[0];
    const enOvr = Math.round(((en.power||50)+(en.speed||50)+(en.defense||50)+(en.stamina||50)+(en.endurance||50))/5);
    const win = (ovr + Math.random()*12) >= (enOvr + Math.random()*12);
    if (win) { U.stars = (U.stars||10)+1; U.challenge_wins = (U.challenge_wins||0)+1; alert('MENANG DUEL lawan ' + en.username + '! (+1 Bintang)'); }
    else { U.challenge_losses = (U.challenge_losses||0)+1; alert('KALAH DUEL lawan ' + en.username + '!'); }
    await fetch(URL_SB + '/rest/v1/players?username=eq.' + encodeURIComponent(U.username), {method:'PATCH',headers:H,body:JSON.stringify({stars:U.stars,challenge_wins:U.challenge_wins,challenge_losses:U.challenge_losses})});
    localStorage.setItem('tb_v2', JSON.stringify(U));
    renderHome();
  };
  wrap.append(inpEnemy, btnDuel);

  const btnOut = el('button', 'width:100%;padding:10px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#f87171;cursor:pointer', 'Keluar Akun');
  btnOut.onclick = () => { localStorage.removeItem('tb_v2'); renderLogin(); };
  wrap.appendChild(btnOut);
  document.body.appendChild(wrap);
}

const saved = localStorage.getItem('tb_v2');
if (saved) { U = JSON.parse(saved); renderHome(); } else { renderLogin(); }
</script>
</body>
</html>
